name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset correctness
      - name: Build
        run: cmake --build --preset correctness
      - name: Test
        run: ctest --preset correctness
